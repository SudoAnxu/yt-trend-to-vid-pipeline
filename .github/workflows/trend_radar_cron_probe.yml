name: Trend Radar Cron Probe

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify scheduler
        run: |
          echo "GitHub scheduler fired at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Workflow run: ${GITHUB_RUN_ID}"
